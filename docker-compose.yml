version: '3.8'

services:
  engine_1_multiregime_ml:
    build:
      context: ./engines/engine_1_multiregime_ml
      dockerfile: Dockerfile
    container_name: engine_1_multiregime_ml
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./engines/engine_1_multiregime_ml/data:/app/data
      - ./engines/engine_1_multiregime_ml/logs:/app/logs

  engine_2_momentum_3candle:
    build:
      context: ./engines/engine_2_momentum_3candle
      dockerfile: Dockerfile
    container_name: engine_2_momentum_3candle
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./engines/engine_2_momentum_3candle/active_trades.json:/app/active_trades.json

  engine_3_confluence_scalper:
    build:
      context: ./engines/engine_3_confluence_scalper
      dockerfile: Dockerfile
    container_name: engine_3_confluence_scalper
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./engines/engine_3_confluence_scalper/active_trades.json:/app/active_trades.json

  engine_4_reversal_5candle:
    build:
      context: ./engines/engine_4_reversal_5candle
      dockerfile: Dockerfile
    container_name: engine_4_reversal_5candle
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./engines/engine_4_reversal_5candle/active_trades.json:/app/active_trades.json

  engine_5_deterministic_smc:
    build:
      context: ./engines/engine_5_deterministic_smc
      dockerfile: Dockerfile
    container_name: engine_5_deterministic_smc
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./engines/engine_5_deterministic_smc/smc_trading.db:/app/smc_trading.db
      - ./engines/engine_5_deterministic_smc/bot.log:/app/bot.log

  engine_6_fibonacci_pullback:
    build:
      context: ./engines/engine_6_fibonacci_pullback
      dockerfile: Dockerfile
    container_name: engine_6_fibonacci_pullback
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./engines/engine_6_fibonacci_pullback/data:/app/data
      - ./engines/engine_6_fibonacci_pullback/trading_bot.log:/app/trading_bot.log

  engine_7_institutional_fvg:
    build:
      context: ./engines/engine_7_institutional_fvg
      dockerfile: Dockerfile
    container_name: engine_7_institutional_fvg
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./engines/engine_7_institutional_fvg/data:/app/data
      - ./engines/engine_7_institutional_fvg/bot_live.log:/app/bot_live.log

  engine_8_gfs_multitimeframe:
    build:
      context: ./engines/engine_8_gfs_multitimeframe
      dockerfile: Dockerfile
    container_name: engine_8_gfs_multitimeframe
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./engines/engine_8_gfs_multitimeframe/data:/app/data
      - ./engines/engine_8_gfs_multitimeframe/gfs_live.log:/app/gfs_live.log



